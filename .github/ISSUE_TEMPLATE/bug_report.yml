name: Bug Report
description: Report a bug or authentication issue with an Egis Match-on-Chip fingerprint sensor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: device_id
    attributes:
      label: Sensor USB ID (lsusb)
      description: Run `lsusb | grep -i -E "1c7a|egis|lightuning"` and paste the output
      placeholder: "Bus 003 Device 002: ID 1c7a:0582 LighTuning Technology Inc. ETU905A80-E"
    validations:
      required: true
  - type: input
    id: laptop_model
    attributes:
      label: Laptop Model & Linux Distribution
      placeholder: "Samsung Galaxy Book2 Pro 360 (930QED) - Arch Linux"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened and how to reproduce it?
      description: Describe whether the issue happens during `fprintd-enroll`, `fprintd-verify`, `sudo`, or the desktop lock screen (GDM/GNOME).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: fprintd Logs (journalctl)
      description: Output of `journalctl -u fprintd -n 50 --no-pager`
      render: shell
