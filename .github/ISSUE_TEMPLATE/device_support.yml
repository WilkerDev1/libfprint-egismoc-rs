name: Solicitud de Soporte para Nuevo Sensor Egis (Device Support)
description: Solicita soporte para otra variante USB de Egis Technology (1c7a:xxxx)
title: "[Device Support]: 1c7a:"
labels: ["enhancement", "hardware"]
body:
  - type: input
    id: usb_id
    attributes:
      label: Salida de lsusb
      placeholder: "ID 1c7a:0583 LighTuning Technology Inc."
    validations:
      required: true
  - type: input
    id: laptop
    attributes:
      label: Marca y Modelo de Laptop
      placeholder: "Samsung Galaxy Book3 Pro / ASUS ExpertBook / etc."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Salida de `lsusb -v -d 1c7a:` o información adicional
      render: shell
