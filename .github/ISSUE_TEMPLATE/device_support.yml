name: New Egis Sensor Support Request (Device Support)
description: Request support for another Egis Technology (1c7a:xxxx) USB fingerprint sensor variant
title: "[Device Support]: 1c7a:"
labels: ["enhancement", "hardware"]
body:
  - type: input
    id: usb_id
    attributes:
      label: lsusb Output
      placeholder: "ID 1c7a:0583 LighTuning Technology Inc."
    validations:
      required: true
  - type: input
    id: laptop
    attributes:
      label: Laptop Brand & Model
      placeholder: "Samsung Galaxy Book3 Pro / ASUS ExpertBook / etc."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Output of `lsusb -v -d 1c7a:` or additional details
      render: shell
